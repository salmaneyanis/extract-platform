services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - main_service
    networks:
      - frontend-network
    restart: unless-stopped

  main_service:
    build: ./main_service
    ports:
      - "8000:8000"
    environment:
      - EXTRACT_URL=http://extract:8001
      - RETRIEVE_URL=http://retrieve:8002
      - STORE_URL=http://store_data:8003
    depends_on:
      - extract
      - retrieve
      - store_data
    networks:
      - retrieve-network
      - extract-network
      - store-network
      - frontend-network
    restart: unless-stopped
  extract:
    build: ./extract
    ports:
      - "3001:8001"
    volumes:
    - ./extract:/app 
    networks:
      - extract-network
    restart: unless-stopped
  retrieve:
    build: ./retrieve
    ports:
      - "3002:8002"
    volumes:
      - retrieve_data:/data
    networks:
      - retrieve-network
    restart: unless-stopped
    
  store_data:
    build: ./store_data
    ports:
    - "3003:8003"
    volumes:
    - ./store_data:/app             
    environment:
    - DATABASE_URL=postgresql+asyncpg://user:pass@store_db:5432/mydb
    depends_on:
    - store_db
    networks:
    - store-network
    - db-network
    restart: unless-stopped

  store_db:
    image: postgres:16
    ports:
      - "3013:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-network
    restart: unless-stopped

volumes:
  postgres_data:
  retrieve_data:
  
networks:
  retrieve-network:
  extract-network:
  store-network:
  db-network:
  frontend-network:

    